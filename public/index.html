<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="Aashish Maharjan — Senior Frontend Engineer and Frontend Team Lead. React, TypeScript, frontend architecture, automated testing and full-stack product development."
    />
    <meta name="author" content="Aashish Maharjan" />
    <title>Aashish Maharjan | Senior Frontend Engineer &amp; Team Lead</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./bootstrap.min.css" />
    <link rel="stylesheet" href="./main.css" />
    <script>
      function computeDarkTheme(isEnable) {
        const themeImage = document.querySelector("#theme-img");
        if (isEnable) {
          document.body.classList.add("theme-dark");
          if (themeImage) themeImage.src = "./pic_bulboff.gif";
        } else {
          document.body.classList.remove("theme-dark");
          if (themeImage) themeImage.src = "./pic_bulbon.gif";
        }
        try {
          localStorage.setItem("theme", isEnable ? "dark" : "light");
        } catch (_) {
          // Theme switching still works when browser storage is unavailable.
        }
      }

      function restoreTheme() {
        let theme = "dark";
        try {
          theme = localStorage.getItem("theme") || "dark";
        } catch (_) {
          // Use the default theme when browser storage is unavailable.
        }
        computeDarkTheme(theme !== "light");
      }

      window.onload = restoreTheme;
    </script>
  </head>
  <body class="theme-dark" data-spy="scroll" data-target=".navbar" data-offset="50">
    <script>restoreTheme();</script>
    <div id="root"></div>
  </body>
</html>
